name: Build IPA

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        working-directory: RoomHunter
        run: xcodegen generate

      - name: Build (unsigned, ad-hoc later)
        working-directory: RoomHunter
        run: |
          xcodebuild -project RoomHunter.xcodeproj \
            -scheme RoomHunter \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Ad-hoc sign and package IPA
        working-directory: RoomHunter
        run: |
          set -euxo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/RoomHunter.app"
          test -d "$APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r RoomHunter.ipa Payload
          ls -la RoomHunter.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoomHunter-ipa
          path: RoomHunter/RoomHunter.ipa
          retention-days: 30
