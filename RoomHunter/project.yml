name: RoomHunter
options:
  bundleIdPrefix: nl.jdries
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  RoomHunter:
    type: application
    platform: iOS
    sources: [Sources, Assets]
    resources: [Resources]
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Room Hunter
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: nl.jdries.roomhunter
            CFBundleURLSchemes: [roomhunter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.jdries.roomhunter
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
